<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const APP_VERSION = "5.3.0";
    const WEEKDAYS = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag", "Zondag"];
    const WEEKDAYS_SHORT = ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"];

    /* Kleuren voor brevetniveaus (per positie in de niveaulijst) */
    const LEVEL_DOT_COLORS = [
      "#2ec4b6", "#3d9bd1", "#5a6fd1", "#8a5ad1", "#d15ab8",
      "#e0645a", "#e8963c", "#c9a626", "#6db14f", "#4fb18b"
    ];


    /* ================= Zoeken op naam =================
       Accenten en hoofdletters mogen niet uitmaken: "Ozturk" moet ook Öztürk
       vinden. We vervangen elk teken door zijn kale variant, teken voor teken,
       zodat de posities blijven kloppen voor het oplichten van de treffer. */
    const strip = (s) => (s || "").toLowerCase().split("").map(c => c.normalize("NFD")[0]).join("");

    /* Rang 0 = de naam begint ermee, 1 = een volgend woord begint ermee,
       2 = het staat ergens in de naam. We kijken naar álle plekken waar het
       voorkomt en houden de beste over: bij "Lien Everaert" telt de E van
       Everaert, niet de e van Lien. */
    const WORD_BREAK = /[\s'\-]/;
    function bestMatch(name, q) {
      const t = strip(q).trim();
      if (!t) return null;
      const n = strip(name);
      let best = null;
      for (let i = n.indexOf(t); i !== -1; i = n.indexOf(t, i + 1)) {
        const rank = i === 0 ? 0 : (WORD_BREAK.test(n[i - 1]) ? 1 : 2);
        if (!best || rank < best.rank) best = { index: i, rank, length: t.length };
        if (rank === 0) break;
      }
      return best;
    }
    function nameRank(name, q) {
      if (!strip(q).trim()) return 0;
      const m = bestMatch(name, q);
      return m ? m.rank : -1;
    }

    /* Filtert en herschikt: eerst wie ermee begint, daarna de rest.
       Bij gelijke rang blijft de bestaande beurtvolgorde staan. */
    function searchRows(rows, q, getName) {
      if (!q || !q.trim()) return rows;
      return rows
        .map((row, i) => ({ row, i, r: nameRank(getName(row), q) }))
        .filter(x => x.r >= 0)
        .sort((a, b) => a.r - b.r || a.i - b.i)
        .map(x => x.row);
    }

    /* De treffer in de naam oplichten */
    function Marked({ text, q }) {
      const m = bestMatch(text, q);
      if (!m) return <React.Fragment>{text}</React.Fragment>;
      return (
        <React.Fragment>
          {text.slice(0, m.index)}
          <mark>{text.slice(m.index, m.index + m.length)}</mark>
          {text.slice(m.index + m.length)}
        </React.Fragment>
      );
    }

    function SearchBox({ value, onChange, label, placeholder }) {
      return (
        <div className="search-box">
          {label !== false && <span className="search-label">🔍 Zoek</span>}
          <input
            type="search"
            className={value ? "active" : ""}
            value={value}
            placeholder={placeholder || "Naam leerling…"}
            autoComplete="off"
            spellCheck={false}
            onChange={e => onChange(e.target.value)}
          />
          {value && <button className="btn small" onClick={() => onChange("")}>✕</button>}
        </div>
      );
    }

    /* ================= Beurtvolgorde =================
       Elke leerling heeft één nummer (`position`). Binnen een lesdag bepaalt
       dat de beurtvolgorde; bij gelijke nummers valt de app terug op de naam. */
    const POS_STEP = 10;
    const posOf = (p) => (p.position === null || p.position === undefined ? Number.MAX_SAFE_INTEGER : p.position);
    const byTurn = (a, b) => posOf(a) - posOf(b) || a.name.localeCompare(b.name, "nl");
    const nextPosition = (pupils, weekday, skipId) => {
      const used = pupils
        .filter(p => p.weekday === weekday && p.id !== skipId && p.position !== null && p.position !== undefined)
        .map(p => p.position);
      return (used.length ? Math.max.apply(null, used) : 0) + POS_STEP;
    };

    /* Wat je op het scherm ziet bepaalt waar iemand terechtkomt, ook als er
       gefilterd of gezocht wordt: we kijken naar de zichtbare buur en zetten de
       leerling daar in de volledige lijst naast. Geeft terug welke leerlingen
       een nieuw nummer nodig hebben — de rest blijft ongemoeid. */
    function reorderPlan(all, visible, pupilId, dropIndex) {
      const from = visible.findIndex(p => p.id === pupilId);
      if (from === -1) return [];
      let to = dropIndex;
      if (to > from) to -= 1;
      if (to === from) return [];
      const dragged = all.find(p => p.id === pupilId);
      if (!dragged) return [];
      const visRest = visible.filter(p => p.id !== pupilId);
      const rest = all.filter(p => p.id !== pupilId);
      let at;
      if (to <= 0) {
        const after = visRest[0];
        const i = after ? rest.findIndex(p => p.id === after.id) : -1;
        at = i === -1 ? rest.length : i;
      } else {
        const before = visRest[to - 1];
        const i = before ? rest.findIndex(p => p.id === before.id) : -1;
        at = i === -1 ? rest.length : i + 1;
      }
      const next = rest.slice(0, at).concat([dragged], rest.slice(at));
      const plan = [];
      next.forEach((p, i) => {
        const pos = (i + 1) * POS_STEP;
        if (p.position !== pos) plan.push({ id: p.id, position: pos });
      });
      return plan;
    }

    /* ================= Slepen dat ook op een touchscreen werkt =================
       HTML5 drag-and-drop doet op telefoons en tablets niets, dus luisteren we
       zelf naar pointer-events. Slepen begint op het greepje (⠿); dat heeft
       `touch-action: none`, waardoor de pagina niet meescrollt. Met de muis mag
       je ook de hele rij pakken. */
    let dragEndedAt = 0;
    const dragJustEnded = () => Date.now() - dragEndedAt < 350;

    function dropIndexAt(zone, x, y) {
      const items = Array.prototype.slice.call(zone.querySelectorAll("[data-drop-item]"));
      if (!items.length) return 0;
      const rects = items.map(el => el.getBoundingClientRect());
      const stacked = rects.length < 2 || rects[1].top >= rects[0].bottom - 2;
      if (stacked) {
        for (let i = 0; i < rects.length; i++) {
          if (y < rects[i].top + rects[i].height / 2) return i;
        }
        return rects.length;
      }
      /* Chips die over meerdere regels lopen: eerst de juiste regel zoeken,
         daarna links of rechts van het midden. */
      let best = 0, bestD = Infinity;
      rects.forEach((r, i) => {
        const d = Math.abs(r.top + r.height / 2 - y) * 4 + Math.abs(r.left + r.width / 2 - x);
        if (d < bestD) { bestD = d; best = i; }
      });
      const r = rects[best];
      return x < r.left + r.width / 2 ? best : best + 1;
    }

    function autoScroll(x, y) {
      let node = document.elementFromPoint(x, y);
      while (node && node !== document.body && !(node.scrollHeight > node.clientHeight + 4)) {
        node = node.parentElement;
      }
      const edge = 40, step = 14;
      if (node && node !== document.body && node.scrollHeight > node.clientHeight + 4) {
        const r = node.getBoundingClientRect();
        if (y < r.top + edge) { node.scrollTop -= step; return; }
        if (y > r.bottom - edge) { node.scrollTop += step; return; }
      }
      if (y < edge) window.scrollBy(0, -step);
      else if (y > window.innerHeight - edge) window.scrollBy(0, step);
    }

    function useTurnDrag({ enabled, onDrop }) {
      const [drag, setDrag] = useState(null);
      const [over, setOver] = useState(null);
      const live = useRef({ drag: null, over: null, started: false });

      useEffect(() => () => document.body.classList.remove("dragging-turn"), []);

      const begin = (e, payload) => {
        if (!enabled) return;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.stopPropagation();
        const startX = e.clientX, startY = e.clientY;
        live.current = { drag: null, over: null, started: false };
        let timer = 0;

        const onMove = (ev) => {
          const x = ev.clientX, y = ev.clientY;
          if (!live.current.started) {
            if (Math.abs(x - startX) + Math.abs(y - startY) < 5) return;
            live.current.started = true;
            document.body.classList.add("dragging-turn");
            timer = setInterval(() => {
              const d = live.current.drag;
              if (d) autoScroll(d.x, d.y);
            }, 70);
          }
          if (ev.cancelable) ev.preventDefault();
          const d = Object.assign({}, payload, { x, y });
          live.current.drag = d;
          setDrag(d);
          const el = document.elementFromPoint(x, y);
          const zone = el && el.closest ? el.closest("[data-drop-zone]") : null;
          if (!zone) { live.current.over = null; setOver(null); return; }
          const t = { key: zone.getAttribute("data-drop-zone"), index: dropIndexAt(zone, x, y) };
          live.current.over = t;
          setOver(t);
        };

        const finish = () => {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", finish);
          window.removeEventListener("pointercancel", finish);
          if (timer) clearInterval(timer);
          document.body.classList.remove("dragging-turn");
          const d = live.current.drag, t = live.current.over;
          const wasDragging = live.current.started;
          live.current = { drag: null, over: null, started: false };
          setDrag(null);
          setOver(null);
          if (wasDragging) dragEndedAt = Date.now();
          if (d && t) onDrop(d, t);
        };

        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", finish);
        window.addEventListener("pointercancel", finish);
      };

      return { drag, over, begin };
    }

    /* Het label dat onder je vinger meebeweegt */
    function DragGhost({ drag }) {
      if (!drag) return null;
      return <div className="drag-ghost" style={{ left: drag.x, top: drag.y }}>⠿ {drag.name}</div>;
    }

    /* De oranje streep die laat zien waar de leerling terechtkomt */
    function withDropLine(nodes, at, kind) {
      if (at === null || at === undefined || at < 0) return nodes;
      const out = nodes.slice();
      out.splice(Math.min(at, out.length), 0, <div key="__dropline" className={"drop-line " + kind} />);
      return out;
    }

    /* ---------- Supabase (gedeelde database) ---------- */
    const SUPABASE_URL = "https://gmtmdibcbjatmjbpdizg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VRlu7IahWLuvjOR_zgjZ5A_F2lWKP_K";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CACHE_KEY = "deplons.cache.v5";
    const ROLE_KEY = "deplons.role";
    const FILTER_KEY = "deplons.filterTeacher";
    const todayISO = () => new Date().toISOString().slice(0, 10);

    /* Rol van de ingelogde gebruiker: "admin" beheert leerlingen, lesgevers en
       brevetniveaus; "teacher" vinkt enkel brevetten af en schrijft commentaar.
       Bij twijfel altijd de minst ruime rol. */
    async function fetchRole(userId) {
      try {
        const { data, error } = await sb.from("app_users").select("role").eq("user_id", userId).maybeSingle();
        if (error) throw error;
        const role = (data && data.role) === "admin" ? "admin" : "teacher";
        try { localStorage.setItem(ROLE_KEY, role); } catch {}
        return role;
      } catch (e) {
        console.warn("Rol ophalen mislukt, val terug op beperkte rechten:", e);
        try { return localStorage.getItem(ROLE_KEY) === "admin" ? "admin" : "teacher"; } catch { return "teacher"; }
      }
    }

    /* Alles ophalen en omzetten naar de app-vorm */
    async function fetchAll() {
      const [lv, tc, pu, ac, co, ov] = await Promise.all([
        sb.from("levels").select("*").order("position"),
        sb.from("teachers").select("*").order("name"),
        sb.from("pupils").select("*").order("name"),
        sb.from("achievements").select("*"),
        sb.from("comments").select("*").order("noted_on"),
        sb.from("overrides").select("*"),
      ]);
      for (const r of [lv, tc, pu, ac, co, ov]) if (r.error) throw r.error;
      const levels = lv.data.map(l => ({ id: l.id, name: l.name, position: l.position }));
      const pos = Object.fromEntries(levels.map(l => [l.id, l.position]));
      const teachers = tc.data.map(t => ({ id: t.id, name: t.name }));
      const pupils = pu.data.map(p => ({
        id: p.id,
        name: p.name,
        teacherId: p.teacher_id,
        weekday: p.weekday,
        position: p.position === null || p.position === undefined ? null : p.position,
        achievements: ac.data
          .filter(a => a.pupil_id === p.id)
          .map(a => ({ id: a.id, levelId: a.level_id, date: a.achieved_on }))
          .sort((a, b) => (pos[a.levelId] ?? 0) - (pos[b.levelId] ?? 0)),
        comments: co.data
          .filter(c => c.pupil_id === p.id)
          .map(c => ({ id: c.id, text: c.body, date: c.noted_on })),
        overrides: ov.data
          .filter(o => o.pupil_id === p.id)
          .map(o => ({ id: o.id, from: o.from_date, to: o.to_date })),
      }));
      pupils.sort(byTurn);
      return { levels, teachers, pupils };
    }

    /* Alle schrijfacties: eerst naar de database, daarna verversen */
    function makeApi(refresh, setData) {
      const run = async (op) => {
        try {
          const { error } = await op;
          if (error) throw error;
          await refresh();
        } catch (e) {
          console.error(e);
          alert("Opslaan mislukt — controleer je internetverbinding en probeer opnieuw.");
        }
      };
      return {
        toggleAchievement: (pupilId, levelId, has) => run(
          has
            ? sb.from("achievements").delete().eq("pupil_id", pupilId).eq("level_id", levelId)
            : sb.from("achievements").insert({ pupil_id: pupilId, level_id: levelId, achieved_on: todayISO() })
        ),
        addComment: (pupilId, text) => run(sb.from("comments").insert({ pupil_id: pupilId, body: text, noted_on: todayISO() })),
        updateComment: (id, text) => run(sb.from("comments").update({ body: text, noted_on: todayISO() }).eq("id", id)),
        deleteComment: (id) => run(sb.from("comments").delete().eq("id", id)),
        addOverride: (pupilId, from, to) => run(sb.from("overrides").insert({ pupil_id: pupilId, from_date: from, to_date: to })),
        updateOverride: (id, to) => run(sb.from("overrides").update({ to_date: to }).eq("id", id)),
        deleteOverride: (id) => run(sb.from("overrides").delete().eq("id", id)),
        addPupil: async (fields, firstLevelId) => {
          try {
            const { data: rows, error } = await sb.from("pupils")
              .insert({ name: fields.name, teacher_id: fields.teacherId, weekday: fields.weekday, position: fields.position })
              .select();
            if (error) throw error;
            if (firstLevelId && rows && rows[0]) {
              const r2 = await sb.from("achievements").insert({ pupil_id: rows[0].id, level_id: firstLevelId, achieved_on: todayISO() });
              if (r2.error) throw r2.error;
            }
            await refresh();
          } catch (e) {
            console.error(e);
            alert("Opslaan mislukt — controleer je internetverbinding en probeer opnieuw.");
          }
        },
        updatePupil: (id, fields) => {
          const patch = { name: fields.name, teacher_id: fields.teacherId, weekday: fields.weekday };
          /* Van lesdag veranderd? Dan achteraan in de beurtvolgorde van de nieuwe dag. */
          if (fields.position !== undefined && fields.position !== null) patch.position = fields.position;
          return run(sb.from("pupils").update(patch).eq("id", id));
        },
        /* Beurtvolgorde binnen een lesdag opslaan. We tonen de nieuwe volgorde
           meteen en schrijven alleen de leerlingen weg die echt verschuiven. */
        reorderPupils: async (plan) => {
          if (!plan || !plan.length) return;
          setData(d => {
            if (!d) return d;
            const pupils = d.pupils.map(p => {
              const u = plan.find(x => x.id === p.id);
              return u ? Object.assign({}, p, { position: u.position }) : p;
            });
            pupils.sort(byTurn);
            return Object.assign({}, d, { pupils });
          });
          try {
            const results = await Promise.all(
              plan.map(u => sb.from("pupils").update({ position: u.position }).eq("id", u.id))
            );
            const bad = results.find(r => r.error);
            if (bad) throw bad.error;
            await refresh();
          } catch (e) {
            console.error(e);
            alert("De volgorde opslaan is mislukt — controleer je internetverbinding en probeer opnieuw.");
            await refresh();
          }
        },
        /* Vaste lesdag wijzigen; een eenmalige verplaatsing naar die dag is dan overbodig */
        setPupilWeekday: async (pupilId, weekday, dropOverrideId, position) => {
          try {
            const patch = { weekday };
            if (position !== undefined && position !== null) patch.position = position;
            const r1 = await sb.from("pupils").update(patch).eq("id", pupilId);
            if (r1.error) throw r1.error;
            if (dropOverrideId) {
              const r2 = await sb.from("overrides").delete().eq("id", dropOverrideId);
              if (r2.error) throw r2.error;
            }
            await refresh();
          } catch (e) {
            console.error(e);
            alert("Opslaan mislukt — controleer je internetverbinding en probeer opnieuw.");
          }
        },
        deletePupil: (id) => run(sb.from("pupils").delete().eq("id", id)),
        addTeacher: (name) => run(sb.from("teachers").insert({ name })),
        deleteTeacher: (id) => run(sb.from("teachers").delete().eq("id", id)),
        addLevel: (name, position) => run(sb.from("levels").insert({ name, position })),
        deleteLevel: (id) => run(sb.from("levels").delete().eq("id", id)),
        swapLevels: async (a, b) => {
          try {
            const r1 = await sb.from("levels").update({ position: b.position }).eq("id", a.id);
            if (r1.error) throw r1.error;
            const r2 = await sb.from("levels").update({ position: a.position }).eq("id", b.id);
            if (r2.error) throw r2.error;
            await refresh();
          } catch (e) {
            console.error(e);
            alert("Opslaan mislukt — controleer je internetverbinding en probeer opnieuw.");
          }
        },
      };
    }

    /* Laatst behaalde = laatste element in de lijst (gesorteerd op niveauvolgorde) */
    const latestAch = (p) => p.achievements.length ? p.achievements[p.achievements.length - 1] : null;

    /* ---------- Datum helpers ---------- */
    function startOfWeek(d) {
      const date = new Date(d);
      const day = (date.getDay() + 6) % 7; // maandag = 0
      date.setDate(date.getDate() - day);
      date.setHours(0, 0, 0, 0);
      return date;
    }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function toISODate(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    /* Wie zwemt er op deze datum? (vaste lesdag + eenmalige verplaatsingen) */
    function pupilsOnDate(pupils, date) {
      const iso = toISODate(date);
      const wd = (date.getDay() + 6) % 7;
      const result = [];
      pupils.forEach(p => {
        const ov = p.overrides || [];
        const movedHere = ov.find(o => o.to === iso);
        if (movedHere) result.push({ pupil: p, moved: true, override: movedHere });
        else if (p.weekday === wd && !ov.some(o => o.from === iso)) result.push({ pupil: p, moved: false, override: null });
      });
      return result;
    }
    function fmtDate(d) { return d.toLocaleDateString("nl-BE", { day: "numeric", month: "long" }); }
    function fmtISO(iso) {
      if (!iso) return "";
      return new Date(iso + "T00:00:00").toLocaleDateString("nl-BE", { day: "numeric", month: "short", year: "numeric" });
    }
    function fmtRange(mon) {
      const sun = addDays(mon, 6);
      return `${mon.getDate()} ${mon.toLocaleDateString("nl-BE", { month: "short" })} – ${sun.getDate()} ${sun.toLocaleDateString("nl-BE", { month: "short" })} ${sun.getFullYear()}`;
    }
    const sameDay = (a, b) => a.toDateString() === b.toDateString();

    const TABS = [
      { id: "kalender", label: "📅 Kalender" },
      { id: "leerlingen", label: "🧒 Leerlingen" },
      { id: "lesgevers", label: "🏊 Lesgevers", adminOnly: true },
      { id: "brevetten", label: "🎖️ Brevetten", adminOnly: true },
    ];

    /* ---------- Niveau helpers ---------- */
    function useLevelHelpers(data) {
      const levelName = (id) => (data.levels.find(l => l.id === id) || {}).name || "—";
      const levelColor = (id) => {
        const idx = data.levels.findIndex(l => l.id === id);
        return idx === -1 ? "var(--gray-400)" : LEVEL_DOT_COLORS[idx % LEVEL_DOT_COLORS.length];
      };
      return { levelName, levelColor };
    }

    function LevelBadge({ levelId, data }) {
      const { levelName, levelColor } = useLevelHelpers(data);
      if (!levelId) return <span className="badge muted">Geen brevet</span>;
      const c = levelColor(levelId);
      return (
        <span className="badge" style={{
          background: `color-mix(in srgb, ${c} 16%, white)`,
          color: `color-mix(in srgb, ${c} 72%, black)`
        }}>
          <span className="dot" style={{ background: c }}></span>
          {levelName(levelId)}
        </span>
      );
    }

    /* ================= Kalender ================= */
    function CalendarView({ data, api, openDay, isAdmin }) {
      const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
      const [filterTeacher, setFilterTeacher] = useState(() => {
        try { return localStorage.getItem(FILTER_KEY) || ""; } catch { return ""; }
      });
      const [query, setQuery] = useState("");
      const [pendingMove, setPendingMove] = useState(null);

      /* Gekozen lesgever onthouden, ook na herladen */
      const chooseTeacher = (id) => {
        setFilterTeacher(id);
        try { id ? localStorage.setItem(FILTER_KEY, id) : localStorage.removeItem(FILTER_KEY); } catch {}
      };
      /* Een verwijderde lesgever mag de weergave niet leeg laten lijken */
      useEffect(() => {
        if (filterTeacher && !data.teachers.some(t => t.id === filterTeacher)) chooseTeacher("");
      }, [data.teachers, filterTeacher]);
      const today = new Date();
      const { levelName, levelColor } = useLevelHelpers(data);
      const searching = query.trim().length > 0;

      const allFor = (date) => pupilsOnDate(data.pupils, date);
      const pupilsFor = (date) => searchRows(
        allFor(date).filter(x => !filterTeacher || x.pupil.teacherId === filterTeacher),
        query, x => x.pupil.name
      );
      const teacherLabel = (id) => (data.teachers.find(t => t.id === id) || {}).name || "";

      /* Slepen doet twee dingen: binnen dezelfde dag verandert het de beurt,
         naar een andere dag verplaatst het de les. */
      const handleDrop = (d, target) => {
        const toISO = target.key;
        if (!toISO || !isAdmin) return;
        const targetDate = new Date(toISO + "T00:00:00");
        if (toISO === d.fromISO) {
          if (searching) return; /* tijdens zoeken staat de lijst op relevantie, niet op beurt */
          const all = allFor(targetDate).map(x => x.pupil);
          const visible = pupilsFor(targetDate).map(x => x.pupil);
          api.reorderPupils(reorderPlan(all, visible, d.pupilId, target.index));
          return;
        }
        const pupil = data.pupils.find(p => p.id === d.pupilId);
        if (!pupil) return;
        /* Niet zelf beslissen of dit eenmalig of blijvend is — dat vragen we. */
        setPendingMove({ pupil, fromISO: d.fromISO, toISO, targetDate });
      };

      const { drag, over, begin } = useTurnDrag({ enabled: isAdmin, onDrop: handleDrop });

      /* Alleen deze week: bestaande logica met eenmalige verplaatsingen */
      const confirmOnce = () => {
        const { pupil, fromISO, toISO } = pendingMove;
        const existing = (pupil.overrides || []).find(o => o.to === fromISO);
        if (existing) {
          if (existing.from === toISO) api.deleteOverride(existing.id);
          else api.updateOverride(existing.id, toISO);
        } else {
          api.addOverride(pupil.id, fromISO, toISO);
        }
        setPendingMove(null);
      };

      /* Vanaf nu altijd: de vaste lesdag wijzigen. De leerling sluit achteraan
         aan in de beurtvolgorde van die dag; daar kan je hem verder slepen. */
      const confirmAlways = () => {
        const { pupil, fromISO, targetDate } = pendingMove;
        const newWeekday = (targetDate.getDay() + 6) % 7;
        const stale = (pupil.overrides || []).find(o => o.to === fromISO);
        api.setPupilWeekday(pupil.id, newWeekday, stale ? stale.id : null,
          nextPosition(data.pupils, newWeekday, pupil.id));
        setPendingMove(null);
      };

      return (
        <div className="card">
          <div className="cal-toolbar">
            <button className="btn" onClick={() => setWeekStart(addDays(weekStart, -7))}>←</button>
            <button className="btn" onClick={() => setWeekStart(startOfWeek(new Date()))}>Vandaag</button>
            <button className="btn" onClick={() => setWeekStart(addDays(weekStart, 7))}>→</button>
            <span className="cal-title">{fmtRange(weekStart)}</span>
            <span className="spacer"></span>
            <SearchBox value={query} onChange={setQuery} />
            <div className="filter-box">
              <span className="filter-label">🏊 Lesgever</span>
              <select className={filterTeacher ? "active" : ""} value={filterTeacher}
                onChange={e => chooseTeacher(e.target.value)}>
                <option value="">Alle lesgevers</option>
                {data.teachers.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
              {filterTeacher && <button className="btn small" onClick={() => chooseTeacher("")}>✕ Toon alle</button>}
            </div>
          </div>

          {filterTeacher &&
            <p className="filter-note">Je ziet enkel de leerlingen van {teacherLabel(filterTeacher)}.</p>}
          {searching &&
            <p className="search-note">
              Namen met “{query.trim()}” — wie ermee begint staat vooraan.
              {isAdmin ? " Wis het zoekvakje om de beurtvolgorde weer te kunnen slepen." : ""}
            </p>}

          <div className="week-grid">
            {WEEKDAYS.map((_, i) => {
              const date = addDays(weekStart, i);
              const iso = toISODate(date);
              const entries = pupilsFor(date);
              const total = allFor(date).length;
              const dropHere = over && over.key === iso;
              const movingHere = dropHere && drag && drag.fromISO !== iso;
              const chips = entries.map(({ pupil: p, moved }, idx) => {
                const latest = latestAch(p);
                const dragging = drag && drag.pupilId === p.id;
                return (
                  <div key={p.id}
                    data-drop-item="1"
                    className={"pupil-chip" + (dragging ? " is-dragging" : "")}
                    title={p.name + (latest ? " · " + levelName(latest.levelId) : "") + (moved ? " · eenmalig verplaatst" : "")}
                    onPointerDown={isAdmin && !searching
                      ? (e => { if (e.pointerType === "mouse") begin(e, { pupilId: p.id, name: p.name, fromISO: iso }); })
                      : undefined}
                  >
                    {isAdmin && !searching &&
                      <span className="drag-grip" title="Sleep om de beurt te veranderen"
                        onPointerDown={e => begin(e, { pupilId: p.id, name: p.name, fromISO: iso })}
                        onClick={e => e.stopPropagation()}>⠿</span>}
                    {!searching && <span className="turn-no">{idx + 1}</span>}
                    <span className="dot" style={{ background: latest ? levelColor(latest.levelId) : "var(--gray-200)" }}></span>
                    <span className="pname">{moved ? "↪ " : ""}<Marked text={p.name} q={query} /></span>
                  </div>
                );
              });
              return (
                <div
                  key={i}
                  data-drop-zone={iso}
                  className={"day-col" + (sameDay(date, today) ? " today" : "") + (movingHere ? " drop-target" : "")}
                  onClick={() => { if (!dragJustEnded()) openDay({ weekday: i, date, filterTeacher, query }); }}
                >
                  <div className="day-head">
                    <div className="dname">{WEEKDAYS_SHORT[i]}</div>
                    <div className="dnum">{date.getDate()}</div>
                  </div>
                  {total > 0 &&
                    <div className={"day-tally" + (filterTeacher || searching ? " filtered" : "")}>
                      {filterTeacher || searching
                        ? `${entries.length} van ${total}`
                        : `${total} leerling${total !== 1 ? "en" : ""}`}
                    </div>}
                  <div className="day-body">
                    {withDropLine(chips, dropHere ? over.index : -1, "chip")}
                    {entries.length === 0 &&
                      <div className="day-count">{total > 0 ? "geen treffer" : "—"}</div>}
                  </div>
                </div>
              );
            })}
          </div>

          {isAdmin &&
            <p className="form-hint" style={{ marginTop: 14, marginBottom: 0 }}>
              Sleep aan het ⠿ greepje om de beurtvolgorde binnen een dag te wijzigen,
              of naar een andere dag om de les te verplaatsen.
            </p>}

          <DragGhost drag={drag} />
          {pendingMove && <MoveAsk move={pendingMove} onOnce={confirmOnce} onAlways={confirmAlways} onCancel={() => setPendingMove(null)} />}
        </div>
      );
    }

    /* ========= Keuze bij verslepen: eenmalig of vanaf nu altijd? ========= */
    function MoveAsk({ move, onOnce, onAlways, onCancel }) {
      const toWeekday = (move.targetDate.getDay() + 6) % 7;
      return (
        <div className="modal-backdrop" onClick={onCancel}>
          <div className="modal move-ask" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <button className="btn" onClick={onCancel}>✕</button>
              <h3>{move.pupil.name} verplaatsen</h3>
              <div className="sub">naar {WEEKDAYS[toWeekday].toLowerCase()} {fmtISO(move.toISO)}</div>
            </div>
            <div className="move-body">
              <p>Gaat het om deze ene les, of verandert de vaste lesdag?</p>
              <div className="move-options">
                <button className="btn" onClick={onOnce}>
                  ↪ Alleen deze week
                </button>
                <button className="btn primary" onClick={onAlways}>
                  📅 Vanaf nu altijd op {WEEKDAYS[toWeekday].toLowerCase()}
                </button>
                <button className="btn" onClick={onCancel}>Annuleren</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ================= Brevettenas (horizontaal, aanvinkbaar) ================= */
    function LevelAxis({ pupil, data, api, compact }) {
      const { levelColor } = useLevelHelpers(data);
      const achFor = (levelId) => pupil.achievements.find(a => a.levelId === levelId);

      /* Volgende actie = eerste niet-behaalde niveau in de volgorde */
      const nextIdx = data.levels.findIndex(l => !achFor(l.id));

      const toggle = (levelId) => {
        api.toggleAchievement(pupil.id, levelId, !!achFor(levelId));
      };

      return (
        <div className={"level-axis" + (compact ? " compact" : "")}>
          {data.levels.map((l, i) => {
            const ach = achFor(l.id);
            const isNext = i === nextIdx;
            const c = levelColor(l.id);
            const cls = "axis-step" + (ach ? " done" : isNext ? " next" : " todo");
            return (
              <div key={l.id} className={cls}>
                <button className="axis-dot"
                  style={ach ? { background: c, borderColor: c } : {}}
                  title={l.name + (ach ? " — behaald op " + fmtISO(ach.date) + " (tik om uit te vinken)" : isNext ? " — volgende stap (tik om af te vinken)" : " — nog te behalen (tik om af te vinken)")}
                  onClick={e => { e.stopPropagation(); toggle(l.id); }}>
                  {ach ? "✓" : isNext ? "→" : ""}
                </button>
                {!compact &&
                  <span className="axis-label"
                    style={ach ? { color: `color-mix(in srgb, ${c} 72%, black)`, fontWeight: 800 } : {}}>
                    {l.name}
                  </span>}
              </div>
            );
          })}
        </div>
      );
    }

    /* ================= Dagdetail: leerling-paneel ================= */
    function PupilDetail({ pupil, data, api, dateISO, moved, override, isAdmin }) {
      const [newComment, setNewComment] = useState("");
      const [editCommentId, setEditCommentId] = useState(null);
      const [editCommentText, setEditCommentText] = useState("");
      const [moveDate, setMoveDate] = useState(dateISO || todayISO());

      const addComment = () => {
        if (!newComment.trim()) return;
        api.addComment(pupil.id, newComment.trim());
        setNewComment("");
      };
      const startEditComment = (c) => { setEditCommentId(c.id); setEditCommentText(c.text); };
      const saveComment = () => {
        const text = editCommentText.trim();
        if (text) api.updateComment(editCommentId, text);
        setEditCommentId(null); setEditCommentText("");
      };
      const removeComment = (id) => api.deleteComment(id);

      /* Eenmalige lesdag-verplaatsing */
      const moveLesson = () => {
        if (!moveDate || moveDate === dateISO) return;
        if (moved && override) {
          if (override.from === moveDate) api.deleteOverride(override.id);
          else api.updateOverride(override.id, moveDate);
        } else {
          api.addOverride(pupil.id, dateISO, moveDate);
        }
      };
      const resetMove = () => {
        if (override) api.deleteOverride(override.id);
      };

      return (
        <div className="detail-expand" onClick={e => e.stopPropagation()}>
          {dateISO && !isAdmin && moved && override && (
            <p style={{ fontSize: 12.5, fontWeight: 700, color: "var(--blue-600)", marginBottom: 10 }}>
              ↪ Eenmalig verplaatst van {fmtISO(override.from)} naar {fmtISO(override.to)}
            </p>
          )}

          {dateISO && isAdmin && (
            <React.Fragment>
              <h4>Lesdag (eenmalig verplaatsen)</h4>
              {moved && override && (
                <p style={{ fontSize: 12.5, fontWeight: 700, color: "var(--blue-600)", marginBottom: 6 }}>
                  ↪ Eenmalig verplaatst van {fmtISO(override.from)} naar {fmtISO(override.to)}
                </p>
              )}
              <div className="add-row">
                <input type="date" value={moveDate} onChange={e => setMoveDate(e.target.value)} />
                <button className="btn primary small" onClick={moveLesson}>↪ Verplaats deze les</button>
                {moved && override && <button className="btn small" onClick={resetMove}>↩ Terug naar vaste dag</button>}
              </div>
            </React.Fragment>
          )}

          <h4>Commentaar</h4>
          {pupil.comments.map(c => (
            <div key={c.id} className="comment-row">
              {editCommentId === c.id
                ? <React.Fragment>
                    <textarea value={editCommentText} onChange={e => setEditCommentText(e.target.value)} autoFocus />
                    <div className="comment-actions">
                      <button className="btn primary small" onClick={saveComment}>Opslaan</button>
                      <button className="btn small" onClick={() => setEditCommentId(null)}>Annuleren</button>
                    </div>
                  </React.Fragment>
                : <React.Fragment>
                    <div>{c.text}</div>
                    <div className="cdate">{fmtISO(c.date)}</div>
                    <div className="comment-actions">
                      <button className="btn small" onClick={() => startEditComment(c)}>✏️ Bewerken</button>
                      <button className="btn danger small" onClick={() => removeComment(c.id)}>🗑️ Verwijderen</button>
                    </div>
                  </React.Fragment>}
            </div>
          ))}
          <div className="add-row" style={{ marginTop: 8, flexDirection: "column", alignItems: "stretch" }}>
            <textarea placeholder="Nieuwe commentaar bij deze leerling…" value={newComment}
              onChange={e => setNewComment(e.target.value)} />
            <div><button className="btn primary small" onClick={addComment}>+ Commentaar toevoegen</button></div>
          </div>
        </div>
      );
    }

    function DayDetailModal({ detail, data, api, onClose, isAdmin }) {
      const [expandedId, setExpandedId] = useState(null);
      const [filterTeacher, setFilterTeacher] = useState(detail.filterTeacher || "");
      const [query, setQuery] = useState(detail.query || "");
      const { levelColor } = useLevelHelpers(data);

      const dateISO = toISODate(detail.date);
      const searching = query.trim().length > 0;
      const everyone = pupilsOnDate(data.pupils, detail.date);
      const entries = searchRows(
        everyone.filter(x => !filterTeacher || x.pupil.teacherId === filterTeacher),
        query, x => x.pupil.name
      );
      const teacherName = (id) => (data.teachers.find(t => t.id === id) || {}).name || "—";

      /* Hier sleep je alleen binnen deze ene dag: de beurtvolgorde. */
      const handleDrop = (d, target) => {
        if (!isAdmin || searching || target.key !== dateISO) return;
        api.reorderPupils(reorderPlan(
          everyone.map(x => x.pupil),
          entries.map(x => x.pupil),
          d.pupilId, target.index
        ));
      };
      const { drag, over, begin } = useTurnDrag({ enabled: isAdmin && !searching, onDrop: handleDrop });

      const rows = entries.map(({ pupil: p, moved, override }, idx) => {
        const latest = latestAch(p);
        const expanded = expandedId === p.id;
        const accent = latest ? levelColor(latest.levelId) : "var(--gray-200)";
        const dragging = drag && drag.pupilId === p.id;
        return (
          <div key={p.id} data-drop-item="1"
            className={"detail-row" + (dragging ? " is-dragging" : "")}
            style={{ borderLeft: `5px solid ${accent}` }}>
            <div className="detail-main"
              onClick={() => { if (!dragJustEnded()) setExpandedId(expanded ? null : p.id); }}
              onPointerDown={isAdmin && !searching
                ? (e => { if (e.pointerType === "mouse" && !e.target.closest(".drag-grip")) begin(e, { pupilId: p.id, name: p.name, fromISO: dateISO }); })
                : undefined}>
              <div className="row-lead">
                {isAdmin && !searching &&
                  <span className="drag-grip" title="Sleep om de beurt te veranderen"
                    onPointerDown={e => begin(e, { pupilId: p.id, name: p.name, fromISO: dateISO })}
                    onClick={e => e.stopPropagation()}>⠿</span>}
                {!searching && <span className="turn-no">{idx + 1}</span>}
                <div style={{ minWidth: 0 }}>
                  <div className="name"><Marked text={p.name} q={query} /></div>
                  <div className="teacher">
                    🏊 {teacherName(p.teacherId)}
                    {moved && <span className="moved-tag" title={"Eenmalig verplaatst van " + fmtISO(override.from)}> ↪ eenmalig</span>}
                  </div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                <LevelBadge levelId={latest ? latest.levelId : null} data={data} />
                <span className="chevron" title="Bewerken">{expanded ? "▲" : "▼"}</span>
              </div>
            </div>
            <div className="row-axis" onClick={e => e.stopPropagation()}>
              <LevelAxis pupil={p} data={data} api={api} compact={true} />
            </div>
            {p.comments.length > 0 && !expanded && (
              <div className="inline-comments">
                {p.comments.map(c => (
                  <div key={c.id} className="inline-comment">
                    💬 {c.text} <span className="cdate">({fmtISO(c.date)})</span>
                  </div>
                ))}
              </div>
            )}
            {expanded && <PupilDetail pupil={p} data={data} api={api} dateISO={dateISO} moved={moved} override={override} isAdmin={isAdmin} />}
          </div>
        );
      });

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <button className="btn" onClick={onClose}>✕</button>
              <h3>{WEEKDAYS[detail.weekday]} {fmtDate(detail.date)}</h3>
              <div className="sub">
                {filterTeacher || searching
                  ? `${entries.length} van ${everyone.length} leerlingen`
                  : `${entries.length} leerling${entries.length !== 1 ? "en" : ""}`} · klik op een leerling om te bewerken
              </div>
            </div>
            <div className="modal-body">
              <div className="modal-tools">
                <div className="modal-filter" style={{ margin: 0, flex: "1 1 160px" }}>
                  <span>🏊</span>
                  <select className={filterTeacher ? "active" : ""} value={filterTeacher}
                    onChange={e => { setFilterTeacher(e.target.value); try { e.target.value ? localStorage.setItem(FILTER_KEY, e.target.value) : localStorage.removeItem(FILTER_KEY); } catch {} }}>
                    <option value="">Alle lesgevers</option>
                    {data.teachers.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </select>
                </div>
                <SearchBox value={query} onChange={setQuery} label={false} />
              </div>
              {isAdmin && !searching && entries.length > 1 &&
                <p className="form-hint" style={{ marginTop: 0 }}>Sleep aan ⠿ om de beurtvolgorde te wijzigen.</p>}
              {searching &&
                <p className="search-note">Namen met “{query.trim()}” — wie ermee begint staat vooraan.</p>}
              {entries.length === 0 &&
                <p style={{ fontSize: 14, fontWeight: 600, color: "var(--gray-600)" }}>
                  {everyone.length === 0 ? "Geen leerlingen ingepland op deze dag." : "Geen leerling gevonden."}
                </p>}
              <div data-drop-zone={dateISO}>
                {withDropLine(rows, over && over.key === dateISO ? over.index : -1, "row")}
              </div>
            </div>
            <DragGhost drag={drag} />
          </div>
        </div>
      );
    }

    /* ================= Leerlingen ================= */
    function PupilsView({ data, api, isAdmin }) {
      const [name, setName] = useState("");
      const [levelId, setLevelId] = useState("");
      const [teacherId, setTeacherId] = useState("");
      const [weekday, setWeekday] = useState("");
      const [editId, setEditId] = useState(null);
      const [query, setQuery] = useState("");

      const reset = () => { setName(""); setLevelId(""); setTeacherId(""); setWeekday(""); setEditId(null); };
      const searching = query.trim().length > 0;

      const submit = () => {
        if (!name.trim()) return;
        const wd = weekday === "" ? null : Number(weekday);
        const fields = { name: name.trim(), teacherId: teacherId || null, weekday: wd };
        if (editId) {
          const current = data.pupils.find(p => p.id === editId);
          /* Andere lesdag? Dan achteraan in de beurtvolgorde van die dag. */
          if (current && current.weekday !== wd) fields.position = nextPosition(data.pupils, wd, editId);
          api.updatePupil(editId, fields);
        } else {
          fields.position = nextPosition(data.pupils, wd, null);
          api.addPupil(fields, levelId || null);
        }
        reset();
      };

      const edit = (p) => {
        setEditId(p.id); setName(p.name);
        setLevelId("");
        setTeacherId(p.teacherId || "");
        setWeekday(p.weekday === null || p.weekday === undefined ? "" : String(p.weekday));
      };

      const remove = (id) => {
        if (confirm("Deze leerling en alle brevetten/commentaren verwijderen?")) api.deletePupil(id);
      };

      const teacherName = (id) => (data.teachers.find(t => t.id === id) || {}).name || "—";

      /* Per lesdag gegroepeerd, binnen de dag op beurtvolgorde */
      const groups = [];
      for (let i = 0; i < 7; i++) {
        groups.push({ key: "wd-" + i, label: WEEKDAYS[i], all: data.pupils.filter(p => p.weekday === i) });
      }
      groups.push({
        key: "wd-none", label: "Zonder vaste lesdag", noDay: true,
        all: data.pupils.filter(p => p.weekday === null || p.weekday === undefined)
      });

      const handleDrop = (d, target) => {
        if (!isAdmin || searching) return;
        if (target.key !== d.fromKey) return; /* van dag veranderen doe je met ✏️ of in de kalender */
        const group = groups.find(g => g.key === target.key);
        if (!group) return;
        api.reorderPupils(reorderPlan(
          group.all,
          searchRows(group.all, query, p => p.name),
          d.pupilId, target.index
        ));
      };
      const { drag, over, begin } = useTurnDrag({ enabled: isAdmin && !searching, onDrop: handleDrop });

      const found = groups.reduce((n, g) => n + searchRows(g.all, query, p => p.name).length, 0);

      return (
        <div className="card">
          <div className="manage-head"><h2>Leerlingen</h2></div>
          {isAdmin &&
          <div className="form-row">
            <input type="text" placeholder="Naam leerling" value={name} onChange={e => setName(e.target.value)} />
            {!editId &&
              <select value={levelId} onChange={e => setLevelId(e.target.value)}>
                <option value="">Eerste brevet (optioneel)…</option>
                {data.levels.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
              </select>}
            <select value={teacherId} onChange={e => setTeacherId(e.target.value)}>
              <option value="">Lesgever…</option>
              {data.teachers.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
            <select value={weekday} onChange={e => setWeekday(e.target.value)}>
              <option value="">Lesdag…</option>
              {WEEKDAYS.map((d, i) => <option key={i} value={i}>{d}</option>)}
            </select>
            <button className="btn primary" onClick={submit}>{editId ? "Opslaan" : "+ Toevoegen"}</button>
            {editId && <button className="btn" onClick={reset}>Annuleren</button>}
          </div>}

          {data.pupils.length > 0 &&
            <div className="manage-head" style={{ marginBottom: 12 }}>
              <SearchBox value={query} onChange={setQuery} />
            </div>}

          <p className="form-hint">
            {searching
              ? `${found} van ${data.pupils.length} leerlingen — wie met “${query.trim()}” begint staat vooraan.`
              : (isAdmin
                  ? "Per lesdag op beurtvolgorde. Sleep aan ⠿ om de beurt te wijzigen; brevetten vink je direct af op de as."
                  : "Per lesdag op beurtvolgorde. Vink brevetten direct af op de as. Leerlingen toevoegen of aanpassen kan enkel met het beheeraccount.")}
          </p>

          {data.pupils.length === 0
            ? <div className="empty-state"><div className="splash">🧒</div><h2>Nog geen leerlingen</h2><p>{isAdmin ? "Voeg hierboven je eerste leerling toe." : "Het beheeraccount moet eerst leerlingen toevoegen."}</p></div>
            : searching && found === 0
              ? <div className="empty-state"><div className="splash">🔍</div><h2>Geen leerling gevonden</h2><p>Geen enkele naam bevat “{query.trim()}”.</p></div>
              : groups.map(g => {
                  const visible = searchRows(g.all, query, p => p.name);
                  if (!visible.length) return null;
                  const cards = visible.map((p, idx) => {
                    const dragging = drag && drag.pupilId === p.id;
                    return (
                      <div key={p.id} data-drop-item="1" className={"pupil-card" + (dragging ? " is-dragging" : "")}>
                        <div className="pupil-card-head">
                          {isAdmin && !searching &&
                            <span className="drag-grip" title="Sleep om de beurt te veranderen"
                              onPointerDown={e => begin(e, { pupilId: p.id, name: p.name, fromKey: g.key })}>⠿</span>}
                          {!searching && <span className="turn-no">{idx + 1}</span>}
                          <div className="pc-info">
                            <strong><Marked text={p.name} q={query} /></strong>
                            <span className="pc-meta">
                              🏊 {teacherName(p.teacherId)} · 📅 {p.weekday === null || p.weekday === undefined ? "—" : WEEKDAYS[p.weekday]} · 🎖️ {p.achievements.length}/{data.levels.length} behaald
                            </span>
                          </div>
                          {isAdmin &&
                          <div className="pc-actions">
                            <button className="btn" onClick={() => edit(p)}>✏️</button>
                            <button className="btn danger" onClick={() => remove(p.id)}>🗑️</button>
                          </div>}
                        </div>
                        <LevelAxis pupil={p} data={data} api={api} />
                        {p.comments.length > 0 && (
                          <div className="inline-comments">
                            {p.comments.map(c => (
                              <div key={c.id} className="inline-comment">💬 {c.text} <span className="cdate">({fmtISO(c.date)})</span></div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  });
                  const showLine = over && over.key === g.key && drag && drag.fromKey === g.key;
                  return (
                    <div key={g.key} className={"day-section" + (g.noDay ? " no-day" : "")}>
                      <div className="day-section-head">
                        <h3>{g.noDay ? "❔ " : "📅 "}{g.label}</h3>
                        <span className="count">
                          {searching ? `${visible.length} van ${g.all.length}` : `${g.all.length} leerling${g.all.length !== 1 ? "en" : ""}`}
                        </span>
                      </div>
                      <div className="pupil-cards" data-drop-zone={g.key}>
                        {withDropLine(cards, showLine ? over.index : -1, "row")}
                      </div>
                    </div>
                  );
                })}

          <DragGhost drag={drag} />
        </div>
      );
    }

    /* ================= Lesgevers ================= */
    function TeachersView({ data, api }) {
      const [name, setName] = useState("");
      const add = () => {
        if (!name.trim()) return;
        api.addTeacher(name.trim());
        setName("");
      };
      const remove = (id) => {
        if (confirm("Deze lesgever verwijderen? Leerlingen blijven bestaan zonder lesgever.")) api.deleteTeacher(id);
      };
      const count = (id) => data.pupils.filter(p => p.teacherId === id).length;

      return (
        <div className="card">
          <div className="manage-head"><h2>Lesgevers</h2></div>
          <div className="form-row">
            <input type="text" placeholder="Naam lesgever" value={name}
              onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} />
            <button className="btn primary" onClick={add}>+ Toevoegen</button>
          </div>
          {data.teachers.length === 0
            ? <div className="empty-state"><div className="splash">🏊</div><h2>Nog geen lesgevers</h2><p>Voeg hierboven je eerste lesgever toe.</p></div>
            : <table>
                <thead><tr><th>Naam</th><th>Leerlingen</th><th></th></tr></thead>
                <tbody>
                  {data.teachers.map(t => (
                    <tr key={t.id}>
                      <td><strong>{t.name}</strong></td>
                      <td>{count(t.id)}</td>
                      <td style={{ textAlign: "right" }}>
                        <button className="btn danger" onClick={() => remove(t.id)}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>}
        </div>
      );
    }

    /* ================= Brevetniveaus ================= */
    function LevelsView({ data, api }) {
      const [name, setName] = useState("");
      const { levelColor } = useLevelHelpers(data);
      const add = () => {
        if (!name.trim()) return;
        const maxPos = data.levels.reduce((m, l) => Math.max(m, l.position ?? 0), -1);
        api.addLevel(name.trim(), maxPos + 1);
        setName("");
      };
      const remove = (id) => {
        if (confirm("Dit brevetniveau verwijderen? Behaalde brevetten van dit niveau verdwijnen ook.")) api.deleteLevel(id);
      };
      const move = (idx, dir) => {
        const j = idx + dir;
        if (j < 0 || j >= data.levels.length) return;
        api.swapLevels(data.levels[idx], data.levels[j]);
      };
      const count = (id) => data.pupils.filter(p => p.achievements.some(a => a.levelId === id)).length;

      return (
        <div className="card">
          <div className="manage-head"><h2>Brevetniveaus</h2></div>
          <div className="form-row">
            <input type="text" placeholder="Naam brevetniveau" value={name}
              onChange={e => setName(e.target.value)} onKeyDown={e => e.key === "Enter" && add()} />
            <button className="btn primary" onClick={add}>+ Toevoegen</button>
          </div>
          <table>
            <thead><tr><th>#</th><th>Niveau</th><th>Behaald door</th><th></th></tr></thead>
            <tbody>
              {data.levels.map((l, i) => (
                <tr key={l.id}>
                  <td>{i + 1}</td>
                  <td>
                    <span className="badge" style={{
                      background: `color-mix(in srgb, ${levelColor(l.id)} 16%, white)`,
                      color: `color-mix(in srgb, ${levelColor(l.id)} 72%, black)`
                    }}>
                      <span className="dot" style={{ background: levelColor(l.id) }}></span>
                      {l.name}
                    </span>
                  </td>
                  <td>{count(l.id)}</td>
                  <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>
                    <button className="btn" onClick={() => move(i, -1)}>↑</button>{" "}
                    <button className="btn" onClick={() => move(i, 1)}>↓</button>{" "}
                    <button className="btn danger" onClick={() => remove(l.id)}>🗑️</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    /* ================= Login ================= */
    function LoginView() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      const login = async (e) => {
        e.preventDefault();
        setBusy(true); setError("");
        const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        setBusy(false);
        if (error) setError("Inloggen mislukt. Controleer e-mail en wachtwoord.");
      };

      return (
        <div className="login-wrap">
          <div className="card login-card">
            <div className="app-logo" style={{ margin: "0 auto 12px" }}>🌊</div>
            <h2>De plons</h2>
            <p>Log in om de gedeelde zwemles-data te bekijken.</p>
            <form onSubmit={login}>
              <input type="email" placeholder="E-mailadres" value={email} autoComplete="username"
                onChange={e => setEmail(e.target.value)} required />
              <input type="password" placeholder="Wachtwoord" value={password} autoComplete="current-password"
                onChange={e => setPassword(e.target.value)} required />
              {error && <p className="login-error">{error}</p>}
              <button className="btn primary" type="submit" disabled={busy}>
                {busy ? "Bezig…" : "Inloggen"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    /* ================= App ================= */
    function App() {
      const [session, setSession] = useState(undefined); // undefined = nog niet gecheckt
      const [role, setRole] = useState(null);            // null = nog niet opgehaald
      const [data, setData] = useState(null);
      const [offline, setOffline] = useState(false);
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem("deplons.lastTab") || "kalender");
      const [dayDetail, setDayDetail] = useState(null);

      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = sb.auth.onAuthStateChange((_event, s) => {
          setSession(s);
          if (!s) { setRole(null); try { localStorage.removeItem(ROLE_KEY); } catch {} }
        });
        return () => subscription.unsubscribe();
      }, []);

      /* Rechten ophalen zodra iemand is ingelogd */
      useEffect(() => {
        if (!session) return;
        let cancelled = false;
        fetchRole(session.user.id).then(r => { if (!cancelled) setRole(r); });
        return () => { cancelled = true; };
      }, [session ? session.user.id : null]);

      const refresh = async () => {
        try {
          const d = await fetchAll();
          setData(d);
          setOffline(false);
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch {}
        } catch (e) {
          console.warn("Data laden mislukt, val terug op cache:", e);
          try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) setData(JSON.parse(cached));
          } catch {}
          setOffline(true);
        }
      };

      useEffect(() => {
        if (!session) return;
        refresh();
        /* Live meekijken: elke wijziging van een collega ververst de app */
        const channel = sb.channel("db-changes")
          .on("postgres_changes", { event: "*", schema: "public" }, () => refresh())
          .subscribe();
        return () => sb.removeChannel(channel);
      }, [session ? session.user.id : null]);

      useEffect(() => { localStorage.setItem("deplons.lastTab", activeTab); }, [activeTab]);

      const api = makeApi(refresh, setData);
      const logout = () => sb.auth.signOut();
      const isAdmin = role === "admin";
      const visibleTabs = TABS.filter(t => !t.adminOnly || isAdmin);

      /* Verborgen tabblad geselecteerd (bv. na wisselen van account): terug naar de kalender */
      useEffect(() => {
        if (role && !visibleTabs.some(t => t.id === activeTab)) setActiveTab("kalender");
      }, [role, activeTab]);

      if (session === undefined) return <div className="load-screen">🌊</div>;
      if (!session) return <LoginView />;
      if (!data || !role) return <div className="load-screen">🌊<span>Data laden…</span></div>;

      return (
        <React.Fragment>
          <header className="app-header">
            <div className="app-logo">🌊</div>
            <div className="app-title">
              <h1>De plons</h1>
              <p>{isAdmin ? "Beheer" : "Lesgever"}{offline ? " · ⚠️ offline (alleen lezen)" : ""}</p>
            </div>
            <button className="btn logout-btn" onClick={logout} title="Uitloggen">Uitloggen</button>
            <div className="header-bubbles"></div>
            <svg className="header-wave" width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 25 Q 15 12, 30 25 T 60 25 T 90 25 T 120 25 T 150 25 T 180 25" stroke="rgba(255,255,255,0.55)" strokeWidth="3" strokeLinecap="round" fill="none"/>
              <path d="M0 34 Q 15 22, 30 34 T 60 34 T 90 34 T 120 34 T 150 34 T 180 34" stroke="rgba(255,255,255,0.3)" strokeWidth="3" strokeLinecap="round" fill="none"/>
            </svg>
          </header>

          <nav className="tab-bar">
            {visibleTabs.map(tab => (
              <button key={tab.id}
                className={activeTab === tab.id ? "active" : ""}
                onClick={() => setActiveTab(tab.id)}>
                {tab.label}
              </button>
            ))}
          </nav>

          {activeTab === "kalender" && <CalendarView data={data} api={api} openDay={setDayDetail} isAdmin={isAdmin} />}
          {activeTab === "leerlingen" && <PupilsView data={data} api={api} isAdmin={isAdmin} />}
          {activeTab === "lesgevers" && isAdmin && <TeachersView data={data} api={api} />}
          {activeTab === "brevetten" && isAdmin && <LevelsView data={data} api={api} />}

          {dayDetail && <DayDetailModal detail={dayDetail} data={data} api={api} onClose={() => setDayDetail(null)} isAdmin={isAdmin} />}

          <footer className="app-footer">〜 De plons · v{APP_VERSION} · {isAdmin ? "beheeraccount" : "lesgeversaccount"} 〜</footer>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    /* PWA: service worker registreren (alleen via https of localhost) */
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (err) {
          console.warn("Service worker registratie mislukt:", err);
        });
      });
    }
  </script>
</body>
</html>
